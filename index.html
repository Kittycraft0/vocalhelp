<!DOCTYPE html>
<!--redone by vibecoding through google gemini 2.4, access given by a generous friend-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transfeminine Voice Analysis Tools</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Voice Analysis Tools</h1>
    <div class="controls">
      <button id="startButton">Start Microphone</button>
      <label for="speakerTargetSelect">Target:</label>
      <select id="speakerTargetSelect">
        <option value="feminine" selected>Feminine</option>
        <option value="androgynous">Androgynous</option>
        <option value="masculine">Masculine</option>
      </select>
      <p id="status">Status: Idle</p>
    </div>

    <!-- Main container using Flexbox for layout -->
    <div class="main-container">
      <!-- Column 1: Volume Meter -->
      <div class="meter-container">
        <label>Volume</label>
        <canvas id="volumeMeterCanvas" width="50" height="400"></canvas>
      </div>

      <!-- Column 2: Frequency Axis -->
      <div class="frequency-axis-container">
        <label>Freq (Hz)</label>
        <canvas id="frequencyAxisCanvas" width="50" height="400"></canvas>
      </div>

      <!-- Column 3: Spectrogram & Weight -->
      <div class="center-container">
        <div class="spectrogram-container">
          <label>Spectrogram <span class="axis-info">(Est. F0: White Line)</span></label>
          <canvas id="spectrogramCanvas" width="500" height="400"></canvas>
          <div class="axis-labels">
            <span class="x-axis-label">Time --></span>
          </div>
        </div>
        <div class="weight-container">
          <label>Vocal Weight</label>
          <canvas id="weightCanvas" width="500" height="100"></canvas>
          <!-- Static labels drawn on canvas background -->
        </div>
      </div>

      <!-- Column 4: Spectrum & Formant Graph -->
      <div class="right-container">
        <div class="spectrum-container">
          <label>Spectrum <span class="axis-info">(Est. F0: White Line)</span></label>
          <canvas id="spectrumCanvas" width="200" height="400"></canvas>
           <div class="axis-labels">
             <span class="x-axis-label">Amplitude --></span>
           </div>
        </div>
        <div class="formant-container">
          <!-- Updated label -->
          <label>Formant Peaks <span class="axis-info">(White = F1/F2/F3)</span></label>
          <canvas id="formantCanvas" width="200" height="400"></canvas>
           <div class="axis-labels">
             <span class="x-axis-label">Time --></span>
           </div>
        </div>
      </div>

       <!-- Column 5: Formant Labels -->
       <div class="formant-label-container">
         <label>Targets</label>
         <canvas id="formantLabelCanvas" width="60" height="400"></canvas> <!-- Slightly wider -->
       </div>

    </div>

    <script src="script.js"></script>
  </body>
</html>
